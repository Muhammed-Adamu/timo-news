<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - TimoNews</title>
    <link href="../assets/lib/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/lib/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="search">
    <div id="header-container"></div>

    <main class="main-content">
        <section class="container" style="padding:24px 0;">
            <div class="search-hero fade-in">
                <h1>Search News</h1>
                <form onsubmit="event.preventDefault();const q=document.getElementById('searchInput').value.trim();if(q)window.location.href='?q='+encodeURIComponent(q);" class="search-input-group">
                    <input type="text" id="searchInput" placeholder="Search for news, topics, or keywords..." autofocus>
                    <button type="submit"><i class="bi bi-search"></i> Search</button>
                </form>
            </div>

            <div id="filterPills" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;"></div>

            <h3 id="resultCount" style="margin-bottom:16px;"></h3>
            <div class="news-grid" id="searchResults">
                <div class="skeleton skeleton-card"></div>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
    <script src="../assets/lib/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
