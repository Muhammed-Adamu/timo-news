<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TimoNews</title>
    <link href="../assets/lib/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/lib/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="register">
    <div id="header-container"></div>

    <main class="main-content">
        <div class="auth-page">
            <div class="auth-card fade-in">
                <h2><i class="bi bi-person-plus"></i> Create Account</h2>
                <p class="subtitle">Join TimoNews and stay informed</p>
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username (min 3 characters)" minlength="3" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
                        <div id="passwordStrength" style="height:4px;border-radius:2px;margin-top:6px;transition:all 0.3s;"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-accent">
                        <i class="bi bi-person-check"></i> Create Account
                    </button>
                </form>
                <p class="text-center mt-3" style="font-size:13px;">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="../assets/lib/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
